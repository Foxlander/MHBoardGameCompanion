<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed background (maskable: no rounded corners) -->
  <rect width="512" height="512" fill="#111318"/>
  <!-- Safe zone starts at ~72px from edges (safe zone = 80% = 410px centered) -->

  <!-- Decorative ring (inside safe zone) -->
  <rect x="72" y="72" width="368" height="368" rx="30" fill="none" stroke="#c9a84c" stroke-width="4" opacity="0.35"/>

  <!-- Sword blade -->
  <polygon points="256,100  272,235  256,252  240,235" fill="#d8d4e8"/>
  <!-- Blade fuller -->
  <line x1="256" y1="112" x2="256" y2="235" stroke="#c9a84c" stroke-width="3" opacity="0.6"/>
  <!-- Blade tip -->
  <polygon points="256,100  264,120  256,138  248,120" fill="#c9a84c" opacity="0.9"/>

  <!-- Cross-guard -->
  <rect x="206" y="252" width="100" height="20" rx="5" fill="#c9a84c"/>
  <circle cx="216" cy="262" r="5" fill="#1c1f28"/>
  <circle cx="296" cy="262" r="5" fill="#1c1f28"/>

  <!-- Handle -->
  <rect x="246" y="272" width="20" height="72" rx="4" fill="#8a6e32"/>
  <line x1="246" y1="284" x2="266" y2="284" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="246" y1="298" x2="266" y2="298" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="246" y1="312" x2="266" y2="312" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="246" y1="326" x2="266" y2="326" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>

  <!-- Pommel -->
  <circle cx="256" cy="362" r="20" fill="#c9a84c"/>
  <circle cx="256" cy="362" r="11" fill="#8a6e32"/>
  <polygon points="256,353  261,362  256,371  251,362" fill="#c9a84c" opacity="0.8"/>
</svg>
