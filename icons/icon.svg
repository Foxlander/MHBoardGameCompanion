<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="#111318"/>
  <!-- Outer decorative ring -->
  <rect x="18" y="18" width="476" height="476" rx="76" fill="none" stroke="#c9a84c" stroke-width="5" opacity="0.35"/>
  <!-- Inner decorative ring -->
  <rect x="36" y="36" width="440" height="440" rx="62" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.2"/>

  <!-- Sword blade (greatsword style) -->
  <polygon points="256,68  274,230  256,248  238,230" fill="#d8d4e8"/>
  <!-- Blade fuller (groove) -->
  <line x1="256" y1="80" x2="256" y2="230" stroke="#c9a84c" stroke-width="3" opacity="0.6"/>
  <!-- Blade tip diamond -->
  <polygon points="256,68  265,88  256,108  247,88" fill="#c9a84c" opacity="0.9"/>

  <!-- Cross-guard -->
  <rect x="200" y="248" width="112" height="22" rx="6" fill="#c9a84c"/>
  <!-- Guard decorative gems -->
  <circle cx="210" cy="259" r="6" fill="#1c1f28"/>
  <circle cx="302" cy="259" r="6" fill="#1c1f28"/>
  <!-- Guard center diamond -->
  <polygon points="256,250  263,259  256,268  249,259" fill="#111318"/>

  <!-- Handle wrap lines -->
  <rect x="245" y="270" width="22" height="80" rx="4" fill="#8a6e32"/>
  <line x1="245" y1="284" x2="267" y2="284" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="245" y1="300" x2="267" y2="300" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="245" y1="316" x2="267" y2="316" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="245" y1="332" x2="267" y2="332" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>

  <!-- Pommel -->
  <circle cx="256" cy="370" r="22" fill="#c9a84c"/>
  <circle cx="256" cy="370" r="12" fill="#8a6e32"/>
  <polygon points="256,360  261,370  256,380  251,370" fill="#c9a84c" opacity="0.8"/>

  <!-- Corner decorations -->
  <polygon points="60,60  80,60  60,80" fill="#c9a84c" opacity="0.25"/>
  <polygon points="452,60  452,80  432,60" fill="#c9a84c" opacity="0.25"/>
  <polygon points="60,452  80,452  60,432" fill="#c9a84c" opacity="0.25"/>
  <polygon points="452,452  432,452  452,432" fill="#c9a84c" opacity="0.25"/>
</svg>
